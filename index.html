<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AN International: research support, data services, and sustainability solutions for health, environment, and impact." />
  <title>AN International — Research, Innovation & Sustainability</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      color: #2E8B57;
    }

    /* Header Styles */
    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 10px 20px;
      background: #fffaf0;
      border-bottom: 1px solid #f1e97f;
      gap: 20px;
    }

    .header-left { display: flex; align-items: center; justify-content: flex-start; }
    .header-center { display: flex; justify-content: center; }
    .header-right { display: flex; justify-content: flex-end; align-items: center; }

    .logo-section {
      display: flex; align-items: center; justify-content: center;
      background-color: #fffaf0; border-radius: 10px; padding: 5px 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); transition: all 0.3s ease;
    }
    .logo-section img { height: 60px; }

    .logo-text { margin-left: 15px; }
    .logo-text h1 {
      margin: 0; font-size: 45px; font-weight: bold; color: #054b03; white-space: nowrap; line-height: 0.9; font-family: 'Georgia', serif;
    }
    .logo-text p { margin: 0.1px 0 0 0; font-size: 13px; color: rgb(201, 173, 12); font-family: 'Georgia', serif; font-style: italic; }

    .search-box {
      display: flex; align-items: center; border: 1px solid #FFD700; border-radius: 10px; padding: 5px 10px; background-color: white; font-family: 'Georgia', serif; max-width: 250px;
    }
    .search-box input { border: none; outline: none; padding: 5px; font-size: 12px; background: transparent; font-family: 'Georgia', serif; width: 100%; }
    .search-box button { border: none; background: none; cursor: pointer; color: #054b03; font-size: 12px; font-family: 'Georgia', serif; }

    .social-links { display: flex; align-items: center; gap: 10px; }
    .social-links a { text-decoration: none; }

    .social-icon {
      width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background-color: #054b03; color: gold; font-size: 14px; transition: all 0.3s ease;
    }
    .social-icon:hover { transform: scale(1.1); }

    .login-button,
    .registration-button {
      padding: 8px 16px; background-color: #054b03; color: gold; border: none; border-radius: 10px; margin-left: 10px; font-weight: 600; text-align: center; cursor: pointer; transition: transform 0.3s ease; font-family: 'Georgia', serif; text-decoration: none; display: inline-block;
    }
    .login-button { font-size: 12px; }
    .registration-button { font-size: 18px; }
    .login-button:hover, .registration-button:hover { transform: scale(1.05); }

    /* Navigation Styles */
    .nav-toggle { display: none; background-color: #054b03; color: gold; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; width: 100%; text-align: center; font-family: 'Georgia', serif; }

    .nav-bar { background-color: #054b03; display: flex; justify-content: center; padding: 10px; border-bottom: 1px solid gold; border-top: 1px solid gold; position: relative; z-index: 100; }

    .nav-item { position: relative; }
    .nav-bar a.nav-link { color: gold; padding: 10px 20px; text-decoration: none; text-align: center; font-size: 16px; font-family: 'Georgia', serif; font-weight: 400; display: block; transition: all 0.3s ease; }
    .nav-bar a.nav-link:hover { background-color: rgba(255, 215, 0, 0.2); border-radius: 5px; transform: scale(1.05); }

    .dropdown-menu {
      display: none; position: absolute; background-color: #167513; min-width: 200px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); z-index: 101; border-radius: 5px; margin-top: 5px; left: 50%; transform: translateX(-50%);
    }
    .dropdown-menu a { color: gold; padding: 12px 20px; text-decoration: none; display: block; text-align: left; font-size: 14px; font-family: 'Georgia', serif; transition: background-color 0.3s ease; }
    .dropdown-menu a:hover { background-color: rgba(212, 16, 16, 0.2); }
    .nav-item:hover .dropdown-menu { display: block; }

    /* Hide close button by default */
    .close-nav { display: none; }
    @media screen and (max-width: 767px) {
      .close-nav { display: block; }
    }

    /* Slideshow Styles */
    .slideshow-wrapper { display: flex; justify-content: space-between; gap: 20px; width: 90%; max-width: 1200px; margin: 20px auto; flex-wrap: wrap; }
    .slideshow-container { flex: 2; min-width: 300px; position: relative; }
    .slide { display: none; text-align: center; }
    .slideshow-img { width: 100%; height: auto; max-height: 400px; object-fit: contain; border-radius: 8px; }

    .prev, .next {
      cursor: pointer; position: absolute; top: 50%; width: auto; margin-top: -22px; padding: 16px; color: gold; font-weight: bold; font-size: 18px; transition: 0.6s ease; border-radius: 0 3px 3px 0; user-select: none; background-color: rgba(0,0,0,0.5); border: none;
    }
    .next { right: 0; border-radius: 3px 0 0 3px; }
    .prev:hover, .next:hover { background-color: rgba(0,0,0,0.8); }

    .fade { animation-name: fade; animation-duration: 1.5s; }
    @keyframes fade { from { opacity: 0.4 } to { opacity: 1 } }

    .astro-image { flex: 1; min-width: 250px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px; background-color: #ffbf009c; border-radius: 8px; font-size: 15px; }
    .astro-img { width: 100%; height: auto; border-radius: 8px; object-fit: cover; margin-top: 15px; }

    /* Service Sections */
    .research-support, .data-support { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; margin: 20px auto; max-width: 1200px; background-color: #ffdd027d; }
    .research-content-area, .data-content-area { flex: 1; }
    .research-content-area h2, .data-content-area h2 { font-style: italic; font-size: 15px; }
    .reserarch-slider, .data-slider { flex: 1; max-width: 100%; position: relative; margin: 5px 0; }
    .research-img, .data-img { width: 100%; height: auto; border-radius: 8px; object-fit: cover; }
    .research-slides, .data-slides { display: none; animation: fade 1s ease-in-out; }

    /* Footer Styles */
    footer { background-color: #054b03; color: gold; padding: 20px 0; margin-top: 40px; }
    .footer-nav { display: flex; justify-content: center; padding: 20px 0; border-bottom: 2px solid gold; font-family: 'Georgia', serif; flex-wrap: wrap; gap: 10px; }
    .footer-nav a { color: gold; padding: 10px 18px; text-decoration: none; font-size: 14px; font-family: 'Georgia', serif; transition: background-color 0.3s ease; }
    .footer-nav a:hover { background-color: rgba(255, 215, 0, 0.2); border-radius: 5px; }
    .contact-info { text-align: center; padding: 20px 0; font-size: 12px; line-height: 1.5; }
    .contact-info a { color: gold; text-decoration: none; }
    .contact-info a:hover { text-decoration: underline; }

    /* Respect prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none !important; }
      .prev, .next { transition: none !important; }
    }
  </style>
</head>
<body>
  <!-- rest of the HTML content remains unchanged -->
</body>
</html>
