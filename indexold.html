<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AN International</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #fff;
      padding: 15px 20px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #B8860B;
    }

    nav {
      background-color: #333;
      overflow: hidden;
    }

    nav a, .dropdown .dropbtn {
      float: left;
      display: inline-block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
      font-size: 17px;
    }

    nav a:hover, .dropdown:hover .dropbtn {
      background-color: #B8860B;
    }

    .dropdown {
      float: left;
      overflow: hidden;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      z-index: 1;
    }

    .dropdown-content a {
      float: none;
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .dropdown-content a:hover {
      background-color: #ddd;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .slideshow-container {
      position: relative;
      margin: auto;
      max-width: 100%;
    }

    .slide, .slide2 {
      display: none;
      text-align: center;
    }

    .slide img, .slide2 img {
      max-width: 100%;
      height: auto;
    }

    .prev, .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      padding: 16px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      transition: 0.6s ease;
      user-select: none;
      background-color: rgba(0,0,0,0.5);
    }

    .next {
      right: 0;
    }

    .prev {
      left: 0;
    }

    .dots-container {
      text-align: center;
      padding: 10px;
    }

    .dot, .dot2 {
      cursor: pointer;
      height: 15px;
      width: 15px;
      margin: 0 2px;
      background-color: #bbb;
      border-radius: 50%;
      display: inline-block;
      transition: background-color 0.6s ease;
    }

    .active, .dot:hover {
      background-color: #B8860B;
    }

    .active2, .dot2:hover {
      background-color: #B8860B;
    }

    .fade, .fade2 {
      animation-name: fade;
      animation-duration: 1.5s;
    }

    @keyframes fade {
      from {opacity: .4}
      to {opacity: 1}
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px;
      position: relative;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>

<header>
  <h1>AN International</h1>
</header>

<nav>
  <a href="#">Home</a>
  <div class="dropdown">
    <button class="dropbtn">About</button>
    <div class="dropdown-content">
      <a href="#">Our Mission</a>
      <a href="#">Team</a>
      <a href="#">History</a>
    </div>
  </div>
  <div class="dropdown">
    <button class="dropbtn">Projects</button>
    <div class="dropdown-content">
      <a href="#">Ongoing</a>
      <a href="#">Completed</a>
      <a href="#">Publications</a>
    </div>
  </div>
  <a href="#">Contact</a>
</nav>

<!-- First Slideshow -->
<div class="slideshow-container">
  <div class="slide fade">
    <img src="images/slideshow1.png" alt="Slideshow Image 1">
  </div>
  <div class="slide fade">
    <img src="images/slideshow2.png" alt="Slideshow Image 2">
  </div>
  <div class="slide fade">
    <img src="images/slideshow3.png" alt="Slideshow Image 3">
  </div>

  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
  <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>

<div class="dots-container">
  <span class="dot" onclick="currentSlide(1)"></span>
  <span class="dot" onclick="currentSlide(2)"></span>
  <span class="dot" onclick="currentSlide(3)"></span>
</div>

<!-- Second Slideshow -->
<div class="slideshow-container">
  <div class="slide2 fade2">
    <img src="images/slideshow4.png" alt="Slideshow Image 4">
  </div>
  <div class="slide2 fade2">
    <img src="images/slideshow5.png" alt="Slideshow Image 5">
  </div>
  <div class="slide2 fade2">
    <img src="images/slideshow6.png" alt="Slideshow Image 6">
  </div>

  <a class="prev" onclick="plusSlides2(-1)">&#10094;</a>
  <a class="next" onclick="plusSlides2(1)">&#10095;</a>
</div>

<div class="dots-container">
  <span class="dot2" onclick="currentSlide2(1)"></span>
  <span class="dot2" onclick="currentSlide2(2)"></span>
  <span class="dot2" onclick="currentSlide2(3)"></span>
</div>

<footer>
  <p>&copy; 2025 AN International. All rights reserved.</p>
</footer>

<script>
  // First Slideshow
  let slideIndex = 1;
  let slideTimer;

  function showSlides(n) {
    let i;
    const slides = document.getElementsByClassName("slide");
    const dots = document.getElementsByClassName("dot");
    if (n > slides.length) { slideIndex = 1 }
    if (n < 1) { slideIndex = slides.length }
    for (i = 0; i < slides.length; i++) {
      slides[i].style.display = "none";
    }
    for (i = 0; i < dots.length; i++) {
      dots[i].className = dots[i].className.replace(" active", "");
    }
    slides[slideIndex-1].style.display = "block";
    dots[slideIndex-1].className += " active";
  }

  function plusSlides(n) {
    resetSlideTimer();
    showSlides(slideIndex += n);
  }

  function currentSlide(n) {
    resetSlideTimer();
    showSlides(slideIndex = n);
  }

  function startSlideTimer() {
    slideTimer = setInterval(() => {
      slideIndex++;
      showSlides(slideIndex);
    }, 4000);
  }

  function resetSlideTimer() {
    clearInterval(slideTimer);
    startSlideTimer();
  }

  // Second Slideshow
  let slideIndex2 = 1;
  let slideTimer2;

  function showSlides2(n) {
    let i;
    const slides = document.getElementsByClassName("slide2");
    const dots = document.getElementsByClassName("dot2");
    if (n > slides.length) { slideIndex2 = 1 }
    if (n < 1) { slideIndex2 = slides.length }
    for (i = 0; i < slides.length; i++) {
      slides[i].style.display = "none";
    }
    for (i = 0; i < dots.length; i++) {
      dots[i].className = dots[i].className.replace(" active2", "");
    }
    slides[slideIndex2-1].style.display = "block";
    dots[slideIndex2-1].className += " active2";
  }

  function plusSlides2(n) {
    resetSlideTimer2();
    showSlides2(slideIndex2 += n);
  }

  function currentSlide2(n) {
    resetSlideTimer2();
    showSlides2(slideIndex2 = n);
  }

  function startSlideTimer2() {
    slideTimer2 = setInterval(() => {
      slideIndex2++;
      showSlides2(slideIndex2);
    }, 4000);
  }

  function resetSlideTimer2() {
    clearInterval(slideTimer2);
    startSlideTimer2();
  }

  window.addEventListener('load', () => {
    showSlides(slideIndex);
    startSlideTimer();
    showSlides2(slideIndex2);
    startSlideTimer2();
  });
</script>

</body>
</html>
